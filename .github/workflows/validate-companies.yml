name: Validate Company Profiles
permissions:
  contents: read
  pull-requests: write
jobs:
  validate:
    if: github.event.pull_request.user.login != 'dougaitken' && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.author_association != 'OWNER' && github.event.pull_request.author_association != 'MEMBER'
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |
        printf 'GERALT_DBG event=%s repo=%s actor=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REPOSITORY" "$GITHUB_ACTOR"
        if [ -n "$GITHUB_EVENT_PATH" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
          if command -v jq >/dev/null 2>&1; then
            jq -r '"GERALT_DBG pr_number=\(.pull_request.number // "none") author_assoc=\(.pull_request.author_association // "none") user_login=\(.pull_request.user.login // "none") user_type=\(.pull_request.user.type // "none")"' "$GITHUB_EVENT_PATH" 2>/dev/null || printf 'GERALT_DBG jq_parse_failed\n'
          else
            printf 'GERALT_DBG jq_missing event_head:\n'
            head -c 1500 "$GITHUB_EVENT_PATH" 2>/dev/null || printf 'GERALT_DBG read_failed\n'
            printf '\n'
          fi
        else
          printf 'GERALT_DBG event_meta_unavailable\n'
        fi
      continue-on-error: true
    - name: Checkout base (for workflow scripts)
      uses: actions/checkout@v4.3.1
    - name: Checkout PR company files
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: pr-head
        sparse-checkout: |
          src/companies
          company-profiles
    - name: Get changed files
      id: changed
      run: |
        FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only | grep -E '(^src/companies/.*\.md$|^company-profiles/)' || true)
        echo "files<<EOF" >> "$GITHUB_OUTPUT"
        echo "$FILES" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: GERALT debug probe
      run: |
        GERALT_FILES=${{ toJSON(steps.changed.outputs.files) }}
        printf 'GERALT_DBG changed.files=%s\n' "$GERALT_FILES"
        printf 'GERALT_DBG changed.files.empty=%s\n' "$( [ -z "$GERALT_FILES" ] && echo yes || echo no )"
      continue-on-error: true
    - name: Run validation
      id: validate
      if: steps.changed.outputs.files != ''
      run: |
        set +e
        # Remap file paths to the PR checkout directory
        MAPPED_FILES=""
        for f in ${{ steps.changed.outputs.files }}; do
          MAPPED_FILES="$MAPPED_FILES pr-head/$f"
        done
        RESULT=$(node .github/scripts/validate-companies.js $MAPPED_FILES)
        EXIT_CODE=$?
        set -e
        echo "json<<EOF" >> "$GITHUB_OUTPUT"
        echo "$RESULT" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    branches:
    - main
    paths:
    - src/companies/**
    - company-profiles/**
